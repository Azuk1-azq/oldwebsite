<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>URLが変更されました</title>
<link rel="canonical" href="https://rob.azuk1.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563eb' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M1 3h15v13H1zM16 8h4l3 3v5h-7z'/%3E%3Ccircle cx='5.5' cy='18.5' r='2.5'/%3E%3Ccircle cx='18.5' cy='18.5' r='2.5'/%3E%3C/svg%3E">
<style>
:root{--bg:#fff;--card:#fff;--text:#1f2937;--sub:#6b7280;--accent:#2563eb;--accent-h:#1d4ed8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#fff;--card:#fff;--text:#1f2937;--sub:#6b7280;--accent:#2563eb;--accent-h:#1d4ed8}}
:root[data-theme="dark"]{--bg:#fff;--card:#fff;--text:#1f2937;--sub:#6b7280;--accent:#2563eb;--accent-h:#1d4ed8}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--card);max-width:440px;width:100%;padding:40px 28px;border-radius:20px;text-align:center}
.icon{width:72px;height:72px;margin:0 auto 16px;color:var(--accent)}.icon svg{width:100%;height:100%}
h1{font-size:22px;margin:0 0 12px;line-height:1.5}
p{color:var(--sub);margin:0 0 28px;line-height:1.7}
.btn{display:inline-block;border:0;cursor:pointer;font:inherit;font-size:16px;background:var(--accent);color:#fff;font-weight:700;padding:14px 32px;border-radius:999px}
.btn:hover{background:var(--accent-h)}
</style>
</head>
<body>
<main class="card">
<div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 3h15v13H1zM16 8h4l3 3v5h-7z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg></div>
<h1>残念、このサイトのURLは変わりました</h1>
<p>下のボタンを押して新しいサイトに移動しましょう</p>
<button class="btn" type="button" id="go">新しいサイトへ移動</button>
</main>
<script>
document.getElementById('go').addEventListener('click',function(){
  location.replace('https://rob.azuk1.com');
});
</script>
</body>
</html>
